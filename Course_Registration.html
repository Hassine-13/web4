<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Document</title>
</head>
<body>

    <h1>Course Registration</h1>
   
    <form action="Thankyou.html">
        <fieldset>
            <legend>Personal details</legend>

            <table>
                <tr>
                    <td><label>Name</label></td>
                    <td><input type="text" name="FN" placeholder="EX:Bhavya"  size="16" required></td>
                </tr>

                <tr>
                    <td><label>Surname</label></td>
                    <td><input type="text" name="SN" placeholder="EX:Marella" size="16" required></td>


                </tr>

                <tr>
                    <td><label>Mobile Number</label></td>
                    <td><input type="tel" name="MB" placeholder="EX:345672390"  required></td>


                </tr>

                <tr>

                    <td><label>Email</label></td>
                    <td><input type="email" name="email" placeholder="EX:bhav@gmail.com" required></td>


                </tr>

                <tr>
                    <td><label>Password</label></td>
                    <td><input type="password" name="Ps" required></td>



                </tr>

                <tr>
                    <td><label>Confirm Pasword</label></td>
                    <td><input type="password" name="Ps" required></td>


                </tr>

                <tr>
                    <td><label>DOB</label></td>
                    <td><input type="date" name="dob" required></td>


                </tr>

                <tr>
                    <td><label>Gender</label></td>
                    <td><input type="radio" name="gender" required > Male
                        <input type="radio" name="gender" required> Female
                        <input type="radio" name="gender" required> Others</td>


                </tr>
                
                <tr>
                    <td><label>Select country</label></td>
                    <td><select>

                        <option>INDIA</option>
                        <option>US</option>
                        </select></td>

                </tr>


                <tr>

                    <td><label>Upload picture</label></td>
                    <td><input type="file" name="choose photo"></td>

                </tr>

                


            </table>

            <label>Skills</label>
            <input type="checkbox"> Python
            <input type="checkbox"> Java
             <input type="checkbox"> JavaScript <br>
            
            
            <input type="Reset"> <br>
            <input type="Submit">

 
        </fieldset>

        </form>

        

    
    
</body>
</html>
